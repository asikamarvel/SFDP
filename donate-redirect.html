<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Processing Donation - Society for Disease Prevention</title>
  
  <!-- Google reCAPTCHA v3 -->
  <script src="https://www.google.com/recaptcha/api.js?render=6LdL_4wrAAAAABntKK0gm7QCW1KfKivGXshEz4E7"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1a3a52 0%, #2d5a7b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }
    
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      text-align: center;
      max-width: 500px;
      width: 100%;
    }
    
    .logo {
      margin-bottom: 30px;
    }
    
    .logo img {
      height: 60px;
    }
    
    h1 {
      font-size: 24px;
      margin-bottom: 15px;
      color: #1a3a52;
    }
    
    .message {
      font-size: 16px;
      color: #666;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    
    .spinner {
      border: 4px solid #f0f0f0;
      border-top: 4px solid #1a3a52;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .error {
      display: none;
      background: #f8d7da;
      color: #721c24;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #f5c6cb;
    }
    
    .error-message {
      margin-bottom: 15px;
    }
    
    .retry-btn {
      background: #1a3a52;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    
    .retry-btn:hover {
      background: #2d5a7b;
    }
    
    .back-link {
      margin-top: 20px;
    }
    
    .back-link a {
      color: #1a3a52;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
    
    .back-link a:hover {
      text-decoration: underline;
    }
    
    .recaptcha-badge {
      font-size: 12px;
      color: #999;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="img/SFDP PNG 3.png" alt="SFDP Logo">
    </div>
    
    <h1>Processing Your Donation</h1>
    
    <div id="loading" class="message">
      <div class="spinner"></div>
      <p>Verifying security...</p>
      <p style="font-size: 14px; color: #999; margin-top: 10px;">This should only take a moment.</p>
    </div>
    
    <div id="error" class="error">
      <div class="error-message">
        <strong>Verification Failed</strong>
        <p style="margin-top: 10px;">We couldn't verify your request. Please try again.</p>
      </div>
      <button class="retry-btn" onclick="location.reload()">Try Again</button>
      <div class="back-link">
        <a href="donate.html">← Back to Donate</a>
      </div>
    </div>
    
    <div class="recaptcha-badge">
      This site is protected by reCAPTCHA and the Google
      <a href="https://policies.google.com/privacy" style="color: #999;">Privacy Policy</a> and
      <a href="https://policies.google.com/terms" style="color: #999;">Terms of Service</a> apply.
    </div>
  </div>

  <script>
    const RECAPTCHA_SITE_KEY = '6LdL_4wrAAAAABntKK0gm7QCW1KfKivGXshEz4E7';
    const STRIPE_LINK = 'https://buy.stripe.com/8wM16SgXl1ga6Kk7ss';
    
    // Function to verify with reCAPTCHA
    function verifyAndRedirect() {
      console.log('Starting verification...');
      
      // Check if grecaptcha is available
      if (typeof grecaptcha === 'undefined') {
        console.error('reCAPTCHA not loaded');
        redirectToStripe();
        return;
      }
      
      // Use grecaptcha.ready to wait for it to be initialized
      grecaptcha.ready(function() {
        console.log('grecaptcha ready');
        grecaptcha.execute(RECAPTCHA_SITE_KEY, { action: 'donate' })
          .then(function(token) {
            console.log('reCAPTCHA token received:', token.substring(0, 20) + '...');
            redirectToStripe();
          })
          .catch(function(error) {
            console.error('reCAPTCHA execute error:', error);
            redirectToStripe();
          });
      });
    }
    
    function redirectToStripe() {
      console.log('Redirecting to Stripe...');
      setTimeout(function() {
        window.location.href = STRIPE_LINK;
      }, 500);
    }
    
    // Start verification when page loads
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', verifyAndRedirect);
    } else {
      // DOM is already loaded
      setTimeout(verifyAndRedirect, 100);
    }
  </script>
</body>
</html>
